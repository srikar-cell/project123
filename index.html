<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Patil Group | Pipeline Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #f7f5f3;
      --card: #ffffff;
      --border: #ececea;
      --border-strong: rgba(0, 0, 0, 0.14);
      --border-soft: rgba(0, 0, 0, 0.08);
      --text: #1c1210;
      --text2: #4b4b4b;
      --muted: #79726c;
      --maroon: #7a201e;
      --maroon-dark: #5c1614;
      --maroon-tint: #fbeceb;
      --gold: #c9821f;
      --gold-dark: #a1650f;
      --gold-tint: #fbf1de;
      --accent: #7a201e;
      --accent-bg: #fbeceb;
      --accent-text: #7a201e;
      --hazard: #7a201e;
      --hazard-bg: #fbeceb;
      --hazard-text: #7a201e;
      --green: #0f9d4f;
      --green-bg: #e8f8ee;
      --amber: #a1650f;
      --amber-bg: #fbf1de;
      --red: #b23b3b;
      --red-bg: #fbe9e9;
      --gray: #79726c;
      --gray-bg: #f2efec;
      --button-bg: #7a201e;
      --button-text: #ffffff;
      --font-head: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Source Serif 4', serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    h1,
    h2,
    h3 {
      font-weight: 600;
      margin: 0;
      font-family: var(--font-head);
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .mono {
      font-family: var(--font-mono);
    }

    a {
      color: var(--maroon);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      max-width: 100%;
    }

    /* ---------- Login ---------- */
    .login-wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #faf8f6 0%, #f3efec 100%);
      padding: 16px;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 44px 38px;
      width: 380px;
      max-width: 100%;
      box-shadow: 0 24px 60px rgba(122, 32, 30, .08);
      text-align: center;
      border-top: 3px solid var(--maroon);
    }

    .login-card form {
      text-align: left;
    }

    .login-card h1 {
      font-size: clamp(22px, 5vw, 26px);
      margin-bottom: 4px;
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--maroon);
    }

    .login-card p.sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 26px;
      letter-spacing: -0.01em;
    }

    .field {
      margin-bottom: 14px;
      width: 100%;
    }

    .field label {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      font-family: var(--font-body);
      transition: border-color .15s, box-shadow .15s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--maroon);
      box-shadow: 0 0 0 3px var(--maroon-tint);
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font-body);
      letter-spacing: -0.01em;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
      white-space: nowrap;
      max-width: 100%;
    }

    .btn:hover {
      background: var(--gray-bg);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
    }

    .btn-primary {
      background: var(--maroon);
      border-color: var(--maroon);
      color: var(--button-text);
      box-shadow: 0 2px 10px rgba(122, 32, 30, .18);
    }

    .btn-primary:hover {
      background: var(--maroon-dark);
      border-color: var(--maroon-dark);
      box-shadow: 0 6px 20px rgba(122, 32, 30, .28);
    }

    .btn-gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }

    .btn-gold:hover {
      background: var(--gold-dark);
      border-color: var(--gold-dark);
    }

    .btn-danger {
      color: var(--red);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }

    .btn-ghost:hover {
      background: var(--gray-bg);
      color: var(--text);
      box-shadow: none;
    }

    .btn-block {
      width: 100%;
      border-radius: 10px;
      height: 44px;
      padding: 0 18px;
    }

    .login-error {
      background: var(--red-bg);
      color: var(--red);
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      text-align: left;
    }

    .access-note {
      margin-top: 22px;
      padding: 14px 16px;
      background: var(--gray-bg);
      border-radius: 12px;
      font-size: 11.5px;
      color: var(--text2);
      line-height: 1.7;
      font-family: var(--font-body);
      text-align: left;
    }

    .google-btn-wrap {
      display: flex;
      justify-content: center;
      margin: 6px 0 4px;
      min-height: 44px;
    }

    .login-setup-warning {
      background: var(--amber-bg);
      color: var(--amber-dark, #a1650f);
      font-size: 11.5px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      text-align: left;
      line-height: 1.6;
    }

    /* ---------- Shell & Header ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 8px;
      gap: 16px;
      flex-wrap: wrap;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(122, 32, 30, .10);
      flex-shrink: 0;
    }

    .brand .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(122, 32, 30, .12);
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand h1 {
      font-size: clamp(16px, 3.5vw, 19px);
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--maroon);
      line-height: 1.2;
    }

    .brand .tag {
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: 2px;
    }

    .who {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .who .avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--maroon);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11.5px;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    .who .name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .who .role {
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    /* ---------- Navigation Tabs ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--gray-bg);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 22px;
      overflow-x: auto;
      width: 100%;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      border-radius: 999px;
      white-space: nowrap;
      font-family: var(--font-head);
      letter-spacing: -0.01em;
      transition: color .15s, background .15s, box-shadow .15s;
      flex-shrink: 0;
      user-select: none;
      display: inline-flex;
      align-items: center;
    }

    .tab .sheet-no {
      font-family: var(--font-mono);
      font-size: 10px;
      color: inherit;
      opacity: .6;
      margin-right: 6px;
      font-weight: 500;
    }

    .tab.active {
      color: var(--maroon);
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .tab.active .sheet-no {
      opacity: 1;
    }

    .tab:hover:not(.active) {
      color: var(--text);
    }

    /* ---------- Structural Layout & Cards ---------- */
    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      width: 100%;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 20px 22px;
      transition: box-shadow .2s ease;
      width: 100%;
      overflow: hidden;
    }

    .card:hover {
      box-shadow: 0 8px 28px rgba(0, 0, 0, .05);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px 16px;
      width: 100%;
    }

    .section-title>div:first-child {
      flex: 1 1 240px;
      min-width: 0;
    }

    .section-title h2 {
      font-size: clamp(15px, 2.5vw, 17px);
      letter-spacing: -0.02em;
    }

    .section-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    /* ---------- Stat Cards Grid ---------- */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
      width: 100%;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--gold);
      border-radius: 14px;
      padding: 16px 18px;
      transition: box-shadow .2s ease, transform .2s ease;
      min-width: 0;
    }

    .stat-card:hover {
      box-shadow: 0 10px 28px rgba(0, 0, 0, .06);
      transform: translateY(-1px);
    }

    .stat-card .label {
      font-size: 10.5px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 600;
    }

    .stat-card .value {
      font-size: clamp(20px, 4vw, 25px);
      font-weight: 600;
      font-family: var(--font-head);
      letter-spacing: -0.03em;
      color: var(--maroon);
      word-break: break-word;
      line-height: 1.2;
    }

    .stat-card .sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    /* ---------- Tables & Overflow Wrappers ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
      min-width: 640px;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 10px;
      border-bottom: 1px solid var(--border-soft);
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      min-width: 65px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
    }

    td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    tr.clickable:hover {
      background: var(--maroon-tint);
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 250px);
      -webkit-overflow-scrolling: touch;
      width: 100%;
      border-radius: 8px;
    }

    td.mono,
    .mono-cell {
      font-family: var(--font-mono);
      font-size: 12.5px;
    }

    /* ---------- Column resize handles ---------- */
    .resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
      z-index: 11;
    }

    .resizer:hover,
    .resizer.resizing {
      background: var(--maroon);
      opacity: .25;
    }

    /* ---------- Badges & Chips ---------- */
    .badge {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .badge-hot {
      background: var(--red-bg);
      color: var(--red);
    }

    .badge-warm {
      background: var(--gold-tint);
      color: var(--gold-dark);
    }

    .badge-cold {
      background: var(--accent-bg);
      color: var(--accent-text);
    }

    .badge-won {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge-lost {
      background: var(--gray-bg);
      color: var(--gray);
    }

    .badge-stage {
      background: var(--gray-bg);
      color: var(--text2);
    }

    .badge-overdue {
      background: var(--red-bg);
      color: var(--red);
      font-family: var(--font-mono);
    }

    .status-delay {
      background: var(--red-bg);
      color: var(--red);
      font-weight: 700;
    }

    .status-ontime {
      background: var(--green-bg);
      color: var(--green);
      font-weight: 700;
    }

    .status-early {
      background: var(--gold-tint);
      color: var(--gold-dark);
      font-weight: 700;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
    }

    /* Stage rail & Signal chips */
    .stage-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stage-rail {
      display: inline-flex;
      align-items: center;
    }

    .rail-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-strong);
      border: 1px solid var(--border-strong);
      flex: none;
    }

    .rail-dot.filled {
      background: var(--maroon);
      border-color: var(--maroon);
    }

    .rail-dot.current {
      width: 9px;
      height: 9px;
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-tint);
    }

    .rail-seg {
      width: 12px;
      height: 2px;
      background: var(--border-strong);
      flex: none;
    }

    .rail-seg.filled {
      background: var(--maroon);
    }

    .stage-rail-label {
      font-size: 12px;
      color: var(--text2);
    }

    .stage-term {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: .03em;
    }

    .stage-term-won {
      background: var(--green-bg);
      color: var(--green);
    }

    .stage-term-lost {
      background: var(--gray-bg);
      color: var(--gray);
    }

    .signal-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .signal-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
    }

    .sig-red .signal-dot {
      background: var(--red);
    }

    .sig-red {
      color: var(--red);
    }

    .sig-amber .signal-dot {
      background: var(--gold-dark);
    }

    .sig-amber {
      color: var(--gold-dark);
    }

    .sig-blue .signal-dot {
      background: var(--maroon);
    }

    .sig-blue {
      color: var(--maroon);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 34px 10px;
      font-size: 13px;
    }

    .update-meta {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      font-family: var(--font-mono);
    }

    /* ---------- Modals ---------- */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(28, 18, 16, .55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      overflow-y: auto;
      z-index: 999;
    }

    .modal {
      background: #fff;
      border-radius: 18px;
      width: 640px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px 28px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .22);
      border-top: 3px solid var(--maroon);
      position: relative;
      margin: auto;
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 3px;
      letter-spacing: -0.02em;
    }

    .modal .modal-sub {
      color: var(--muted);
      font-size: 12.5px;
      margin-bottom: 20px;
      font-family: var(--font-mono);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .close-x {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      background: var(--gray-bg);
      border-color: transparent;
    }

    .close-x:hover {
      background: var(--maroon-tint);
      color: var(--maroon);
    }

    /* ---------- Filters ---------- */
    .filter-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      width: 100%;
    }

    .filter-bar select,
    .filter-bar input[type=date] {
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      font-size: 13px;
      background: #fff;
      box-sizing: border-box;

    /* ==========================================================================

    /* Mobile Devices & Small Tablets (max-width: 576px) */

    /* Compact / Foldable Mobile Devices (max-width: 360px) */
    @media (max-width:360px) {

    /* Aspect Ratio Adjustments: Landscape on Mobile Devices (max-height: 500px) */
    @media (max-height:500px) and (orientation: landscape) {
      .modal {

    /* Touch Device Optimizations */
    @media (hover: none) and (pointer: coarse) {

      .btn,
      .tab,
      select,

      .pill-btn {
        min-height: 38px;

<body>
  <div id="app"></div>

  <script>
    /* ================= STORAGE ================= */
    const K_USERS = 'crm:users', K_ORDERS = 'crm:orders', K_COORD = 'crm:coordination', K_LOST = 'crm:lostorders', K_ACTIVITY = 'crm:activity';

    /* ================= GOOGLE SIGN-IN CONFIG =================
       OAuth 2.0 Web Client ID from Google Cloud Console.
       You must add the exact URL where this file is hosted (e.g. https://yourdomain.com) as an
       "Authorized JavaScript origin" for the client ID, or Google Sign-In will refuse to load.
       This will NOT work opened as a local file:// path - it must be served over http(s).
    
       Do not put the Google OAuth client secret in this HTML file. Browser code is public, and
       Google Identity Services front-end sign-in only needs the Web Client ID below. */
    const GOOGLE_CLIENT_ID = '1003318748688-mt6e727mff79255ii97bmicmr3gek9f9.apps.googleusercontent.com';

    /* ================= GOOGLE SHEET SYNC =================
       Apps Script web app endpoint connected to the Google Sheet. The client keeps localStorage
       as the offline fallback, and posts each saved collection here for sheet persistence.
       Apps Script should read JSON from e.postData.contents. */
    const GOOGLE_SHEET_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzz_rIgHwbSNJpG49P_lmz2Uub6FfhjlWcydIStKRn6C7Svq-s47EesOMOQ3j6qjmy3/exec';
    const GOOGLE_SHEET_SYNC_KEYS = new Set([K_USERS, K_ORDERS, K_COORD, K_LOST]);

    function sheetNameForKey(key) {
      return ({
        [K_USERS]: 'Users',
        [K_ORDERS]: 'Orders',
        [K_COORD]: 'Coordination',
        [K_LOST]: 'LostOrders'
      })[key] || key;
    }

    function syncToGoogleSheet(key, val) {
      if (!GOOGLE_SHEET_WEB_APP_URL || !GOOGLE_SHEET_SYNC_KEYS.has(key)) return;
      const payload = {
        app: 'pipeline-control',
        action: 'replace',
        key,
        sheet: sheetNameForKey(key),
        timestamp: new Date().toISOString(),
        user: state.currentUser ? {
          username: state.currentUser.username,
          email: state.currentUser.email || state.currentUser.username,
          name: state.currentUser.name || '',
          role: state.currentUser.role || ''
        } : null,
        records: Array.isArray(val) ? val : [val],
        data: val
      };

      fetch(GOOGLE_SHEET_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        keepalive: JSON.stringify(payload).length < 60000
      }).catch(e => console.warn('Google Sheet sync failed', key, e));
    }

    async function storageGet(key) {
      try {
        if (window.storage && window.storage.get) { const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
      } catch (e) { /* fall through to localStorage */ }
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
      catch (e) { return null; }
    }
    async function storageSet(key, val) {
      try {
        if (window.storage && window.storage.set) { await window.storage.set(key, JSON.stringify(val), true); syncToGoogleSheet(key, val); return; }
      } catch (e) { /* fall through to localStorage */ }
      try { localStorage.setItem(key, JSON.stringify(val)); }
      catch (e) { console.error('storage set failed', key, e); }
      syncToGoogleSheet(key, val);
    }

    /* ================= STATE ================= */
    let state = {
      users: [], orders: [], coordination: [], lostOrders: [], activity: {},
      currentUser: null,
      loaded: false,
      activeTab: 'dashboard',
      statsRange: 'week',
      statsDate: new Date().toISOString().slice(0, 10),
      modal: null, // {type:'order'|'coord'|'lost', data:{...}}
      loginError: '',
      adminMode: 'admin',
      viewingAsRep: null, // username the CEO is currently viewing the rep-page of
      dealCycleOrderId: null,
      dealCycleActionFilter: 'all',
      dashboardSubTab: 'attention',
      coordSubTab: 'log',
      lostSubTab: 'list',
      dashPriorityFilter: '',
      dashSortValue: '',
      dealCycleDateRange: 'all', dealCycleSearchQuery: '', dealCycleDelayTypeFilter: 'all',
      reportRangeMode: 'weekly', reportRangeFrom: null, reportRangeTo: null
    };

    const ACTIVE_WINDOW_MIN = 60; // a rep counts as "in field" if seen within this many minutes

    const STAGES = [
      "1. New Lead",
      "2. Meeting Planned / Scheduled",
      "3. Meeting Done / Ongoing Talk",
      "4. Quote Submitted",
      "5. Expected Order / PO Awaited",
      "6. Closed Won (Client!)",
      "7. Closed Lost"
    ];
    const OPEN_STAGES = STAGES.slice(0, 5);
    const PROJECT_TYPES = ["Railway Project", "Airport (AAI) Project", "Metro Project", "Bus Stand Project", "Drainage Project", "Other"];
    const LEAD_SOURCE = ["Inbound", "Outbound"];
    const PRIORITIES = ["Hot", "Warm", "Cold"];
    const PRODUCTS = ["U Drain", "Culverts", "Manhole Covers", "Coping Slabs", "Toilet Blocks", "Crash Barriers", "Others"];

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
    function fmtCr(v) { v = Number(v) || 0; return '₹' + v.toFixed(2) + ' CR'; }
    function isOverdue(d) { if (!d) return false; return new Date(d) < new Date(new Date().toDateString()); }
    function esc(s) { return (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function daysBetween(a, b) { const d1 = new Date(a), d2 = new Date(b); if (isNaN(d1) || isNaN(d2)) return 0; return Math.round((d2 - d1) / 86400000); }

    /* Compares an order's old stage/action/follow-up values against newly submitted ones and
       returns the auto-tracked timestamp + history fields (used by both the full edit form and the
       quick-update form so behavior is identical everywhere). Dates are derived automatically.
       newActionType ('Internal'/'External') tags the NEW action being created (who owns it \u2014
       company or client); actionDelayReason (text) explains why the OLD action ran long, if it did;
       followUpDelayReason (text) explains an overdue follow-up. All three are supplied by the sales
       rep only when required, enforced by the caller before this is invoked. */
    function computeTrackingUpdates(oldOrder, newStage, newNextAction, newFollowUpDate, newActionType, actionDelayReason, actionDelayType, followUpDelayReason, actionRemarks, actionStartDate, actionEndDate) {
      const today = todayStr();

      let stageHistory = (oldOrder.stageHistory || []).slice();
      const stageChanged = (oldOrder.dealStage || '') !== (newStage || '');
      if (!stageHistory.length && oldOrder.dealStage) {
        stageHistory.push({ stage: oldOrder.dealStage, startDate: oldOrder.stageChangedDate || oldOrder.dateLogged || today, endDate: null });
      }
      if (stageChanged) {
        if (stageHistory.length && !stageHistory[stageHistory.length - 1].endDate) {
          stageHistory[stageHistory.length - 1] = { ...stageHistory[stageHistory.length - 1], endDate: today };
        }
        if (newStage) stageHistory.push({ stage: newStage, startDate: today, endDate: null });
      }
      const stageChangedDate = stageChanged ? today : (oldOrder.stageChangedDate || '');

      let actionHistory = (oldOrder.actionHistory || []).slice();
      let nextActionChangedDate = oldOrder.nextActionChangedDate || '';
      const actionChanged = (oldOrder.nextAction || '') !== (newNextAction || '');
      if (actionChanged) {
        if (actionHistory.length && !actionHistory[actionHistory.length - 1].endDate) {
          actionHistory[actionHistory.length - 1] = { ...actionHistory[actionHistory.length - 1], endDate: today, delayReason: actionDelayReason || '', delayType: actionDelayType || '', remarks: actionRemarks || '' };
        } else if (oldOrder.nextAction) {
          actionHistory.push({ text: oldOrder.nextAction, setDate: nextActionChangedDate || oldOrder.dateLogged || today, endDate: today, actionType: '', delayReason: actionDelayReason || '', delayType: actionDelayType || '', remarks: actionRemarks || '', plannedStart: oldOrder.actionStartDate || '', plannedEnd: oldOrder.actionEndDate || '' });
        }
        if (newNextAction) {
          actionHistory.push({ text: newNextAction, setDate: today, endDate: null, actionType: newActionType || '', delayReason: '', remarks: '', plannedStart: actionStartDate || '', plannedEnd: actionEndDate || '' });
        }
        nextActionChangedDate = today;
      } else if (actionHistory.length && !actionHistory[actionHistory.length - 1].endDate) {
        if (newActionType) actionHistory[actionHistory.length - 1] = { ...actionHistory[actionHistory.length - 1], actionType: newActionType };
        if (actionStartDate) actionHistory[actionHistory.length - 1] = { ...actionHistory[actionHistory.length - 1], plannedStart: actionStartDate };
        if (actionEndDate) actionHistory[actionHistory.length - 1] = { ...actionHistory[actionHistory.length - 1], plannedEnd: actionEndDate };
      }

      let followUpHistory = (oldOrder.followUpHistory || []).slice();
      const followUpChanged = (oldOrder.followUpDate || '') !== (newFollowUpDate || '');
      if (followUpChanged && oldOrder.followUpDate) {
        followUpHistory.push({
          label: oldOrder.nextAction || fmtDate(oldOrder.followUpDate),
          targetDate: oldOrder.followUpDate,
          doneDate: today,
          delayReason: followUpDelayReason || '',
          actionKey: oldOrder.nextActionChangedDate || oldOrder.dateLogged || today
        });
      }

      return { stageChangedDate, stageHistory, actionHistory, nextActionChangedDate, followUpHistory };
    }

    /* Worst (longest) completed action dwell-time for an order \u2014 flags the step that took longest to move past. */
    function computeDelayedAction(order) {
      const hist = (order.actionHistory || []).filter(h => h.endDate && h.setDate);
      let worst = null;
      hist.forEach(h => {
        const days = daysBetween(h.setDate, h.endDate);
        if (days > 0 && (!worst || days > worst.days)) worst = { text: h.text, days, actionType: h.actionType || '', delayReason: h.delayReason || '', delayType: h.delayType || '' };
      });
      return worst;
    }
    /* Worst (latest) follow-up completion relative to its original target date. */
    function computeDelayedFollowUp(order) {
      const hist = (order.followUpHistory || []).filter(h => h.doneDate && h.targetDate);
      let worst = null;
      hist.forEach(h => {
        const days = daysBetween(h.targetDate, h.doneDate);
        if (days > 0 && (!worst || days > worst.days)) worst = { label: h.label || fmtDate(h.targetDate), days, delayReason: h.delayReason || '' };
      });
      return worst;
    }
    /* Most recently CLOSED action (not the worst one \u2014 the latest one), for the simplified
       Your Orders / All Orders view. */
    function lastFollowUp(order) {
      const hist = (order.actionHistory || []).filter(h => h.endDate && h.setDate);
      if (!hist.length) return null;
      const sorted = hist.slice().sort((a, b) => (a.endDate || '').localeCompare(b.endDate || ''));
      const h = sorted[sorted.length - 1];
      const days = Math.max(0, daysBetween(h.setDate, h.endDate));
      return { label: h.text || '—', days, reason: h.delayReason || '', delayType: h.delayType || '', actionType: h.actionType || '', onTime: days <= 0 };
    }
    /* How many follow-up cycles happened while a given action entry was the active next-action,
       and how many of those were on time vs delayed \u2014 used on the Deal cycle page. */
    function followUpStatsForAction(order, actionEntry) {
      const key = actionEntry.setDate;
      const list = (order.followUpHistory || []).filter(f => f.actionKey === key);
      const delayed = list.filter(f => daysBetween(f.targetDate, f.doneDate) > 0).length;
      return { total: list.length, onTime: list.length - delayed, delayed };
    }
    /* The follow-up target date that was originally set for a given action \u2014 used as its "planned"
       completion date on the Deal cycle page (earliest follow-up cycle logged against that action). */
    function plannedEndForAction(order, actionEntry) {
      const list = (order.followUpHistory || []).filter(f => f.actionKey === actionEntry.setDate);
      if (!list.length) return null;
      const sorted = list.slice().sort((a, b) => (a.targetDate || '').localeCompare(b.targetDate || ''));
      return sorted[0].targetDate;
    }
    /* Delay / On time / Early classification for a completed action, comparing planned vs actual days taken. */
    function actionStatus(ptd, atd) {
      if (ptd === null || ptd === undefined || isNaN(ptd)) return null;
      if (atd > ptd) return 'Delay';
      if (atd < ptd) return 'Early';
      return 'On time';
    }
    /* Total deal cycle time \u2014 date logged to closed date, or to today if still open. */
    function totalCycleDays(order) {
      const end = order.closedDate || todayStr();
      return daysBetween(order.dateLogged, end);
    }

    /* Is the order currently sitting on an action/follow-up that, if closed out right now, would
       count as delayed \u2014 used to decide whether the rep must be prompted for a reason/type. */
    function pendingActionDelayDays(order) {
      const start = order.nextActionChangedDate || order.dateLogged;
      if (!start || !order.nextAction) return 0;
      if (order.actionEndDate) return Math.max(0, daysBetween(order.actionEndDate, todayStr()));
      if (order.followUpDate) return Math.max(0, daysBetween(order.followUpDate, todayStr()));
      return Math.max(0, daysBetween(start, todayStr()));
    }
    function pendingFollowUpDelayDays(order) {
      if (!order.followUpDate) return 0;
      return Math.max(0, daysBetween(order.followUpDate, todayStr()));
    }
    /* The Internal/External tag already on the currently active (still-open) action, if any. */
    function activeActionType(order) {
      const hist = order.actionHistory || [];
      if (!hist.length) return '';
      const last = hist[hist.length - 1];
      return (!last.endDate) ? (last.actionType || '') : '';
    }

    /* ================= EMPTY STARTUP DATA =================
       No starter orders are created automatically. The tracker starts with empty pipeline data.
       If an older browser already has saved pipeline records, init() clears them once.
       Google users are kept. */
    const K_DATA_VERSION = 'crm:dataVersion';
    const EMPTY_DATA_VERSION = 'empty-2026-08-01';

    async function clearPipelineData() {
      state.orders = [];
      state.coordination = [];
      state.lostOrders = [];
      state.activity = {};
      await Promise.all([
        storageSet(K_ORDERS, state.orders),
        storageSet(K_COORD, state.coordination),
        storageSet(K_LOST, state.lostOrders),
        storageSet(K_ACTIVITY, state.activity),
        storageSet(K_DATA_VERSION, { v: EMPTY_DATA_VERSION })
      ]);
    }

    /* ================= FIELD ACTIVITY & LOCATION ================= */
    async function pingActivity() {
      const u = state.currentUser;
      if (!u || currentRole() !== 'user') return;
      const existing = state.activity[u.username] || {};
      state.activity[u.username] = { ...existing, username: u.username, lastSeen: Date.now() };
      await storageSet(K_ACTIVITY, state.activity);
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        let label = `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`;
        try {
          const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10`);
          const json = await resp.json();
          const a = json.address || {};
          label = a.city || a.town || a.village || a.county || label;
          if (a.state) label += ', ' + a.state;
        } catch (e) { /* offline or blocked — keep coordinates as label */ }
        state.activity[u.username] = { ...state.activity[u.username], lat: latitude, lng: longitude, locationLabel: label, lastSeen: Date.now() };
        await storageSet(K_ACTIVITY, state.activity);
        if (state.currentUser && state.currentUser.username === u.username) render();
      }, () => { /* permission denied or unavailable — location stays unset */ }, { timeout: 8000, maximumAge: 600000 });
    }
    function isRepActive(username) {
      const a = state.activity[username];
      if (!a || !a.lastSeen) return false;
      return (Date.now() - a.lastSeen) < ACTIVE_WINDOW_MIN * 60 * 1000;
    }
    function lastSeenLabel(username) {
      const a = state.activity[username];
      if (!a || !a.lastSeen) return 'No activity yet';
      const mins = Math.round((Date.now() - a.lastSeen) / 60000);
      if (mins < 1) return 'Active just now';
      if (mins < 60) return `Active ${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `Last seen ${hrs}h ago`;
      return `Last seen ${fmtDate(new Date(a.lastSeen).toISOString().slice(0, 10))}`;
    }
    function nextFollowUpFor(username) {
      const open = state.orders.filter(o => o.salesPerson === username && !o.dealStage.startsWith('6.') && !o.dealStage.startsWith('7.') && o.followUpDate);
      if (!open.length) return null;
      return open.slice().sort((a, b) => (a.followUpDate || '9999').localeCompare(b.followUpDate || '9999'))[0];
    }

    /* ================= DATA HELPERS ================= */
    /* Admin is strictly view-only across deals, coordination, and lost-order analysis \u2014
       this single check gates every mutating action and editable control in those areas. */
    function isAdminAccount() { return !!(state.currentUser && state.currentUser.role === 'admin'); }
    function currentRole() {
      if (!state.currentUser) return '';
      return isAdminAccount() && state.adminMode === 'user' ? 'user' : state.currentUser.role;
    }
    function currentUserView() {
      return state.currentUser ? { ...state.currentUser, role: currentRole() } : null;
    }
    function setAdminMode(mode) {
      if (!isAdminAccount()) return;
      state.adminMode = mode === 'user' ? 'user' : 'admin';
      state.viewingAsRep = null;
      state.activeTab = 'dashboard';
      render();
      pingActivity();
    }
    function isAdmin() { return currentRole() === 'admin'; }
    function myOrders() {
      if (!state.currentUser) return [];
      if (isAdmin()) return state.orders;
      return state.orders.filter(o => o.salesPerson === state.currentUser.username);
    }
    function repName(username) {
      const u = state.users.find(u => u.username === username);
      return u ? u.name : username;
    }
    function needsAttention(orders) {
      return orders
        .filter(o => !o.dealStage.startsWith('6.') && !o.dealStage.startsWith('7.'))
        .sort((a, b) => {
          const ao = isOverdue(a.followUpDate) ? 0 : 1, bo = isOverdue(b.followUpDate) ? 0 : 1;
          if (ao !== bo) return ao - bo;
          const ad = a.followUpDate || '9999', bd = b.followUpDate || '9999';
          if (ad !== bd) return ad < bd ? -1 : 1;
          const pr = { Hot: 0, Warm: 1, Cold: 2 };
          return (pr[a.priority] ?? 3) - (pr[b.priority] ?? 3);
        })
        .slice(0, 5);
    }
    function badgeForStage(stage) {
      if (stage.startsWith('6.')) return '<span class="stage-term stage-term-won">Won</span>';
      if (stage.startsWith('7.')) return '<span class="stage-term stage-term-lost">Lost</span>';
      const idx = OPEN_STAGES.indexOf(stage);
      let dots = '';
      for (let i = 0; i < 5; i++) {
        dots += `<span class="rail-dot ${i <= idx ? 'filled' : ''} ${i === idx ? 'current' : ''}"></span>`;
        if (i < 4) dots += `<span class="rail-seg ${i < idx ? 'filled' : ''}"></span>`;
      }
      return `<span class="stage-wrap" title="${esc(stage)}"><span class="stage-rail">${dots}</span><span class="stage-rail-label">${esc(stage.replace(/^\d+\.\s*/, ''))}</span></span>`;
    }
    function badgeForPriority(p) {
      if (!p) return '';
      const cls = p === 'Hot' ? 'sig-red' : p === 'Warm' ? 'sig-amber' : 'sig-blue';
      return `<span class="signal-chip ${cls}"><span class="signal-dot"></span>${esc(p)}</span>`;
    }

    function inRange(dateStr, range, refDate) {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      const ref = new Date(refDate);
      if (range === 'day') {
        return d.toDateString() === ref.toDateString();
      }
      if (range === 'week') {
        const start = new Date(ref); start.setDate(ref.getDate() - ref.getDay());
        const end = new Date(start); end.setDate(start.getDate() + 6);
        return d >= new Date(start.toDateString()) && d <= new Date(end.toDateString() + ' 23:59:59');
      }
      if (range === 'month') {
        return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
      }
      if (range === 'custom') {
        const start = new Date(state.statsDateFrom || refDate);
        const end = new Date(state.statsDateTo || refDate);
        return d >= new Date(start.toDateString()) && d <= new Date(end.toDateString() + ' 23:59:59');
      }
      return true;
    }

    /* ================= COLUMN RESIZE (Excel-like drag-to-resize) =================
       Widths are kept in-memory only (window.__colWidths), keyed by each table's
       data-rkey plus column index, so a column you resize stays put while you switch
       tabs in this session — but resets on a full page reload (by design, not saved
       to storage). Since render() fully replaces #app's innerHTML every time, we
       re-inject the resizer handles and re-apply any saved widths after every render
       rather than trying to preserve DOM nodes across renders. */
    window.__colWidths = window.__colWidths || {};
    function applyColumnWidths() {
      document.querySelectorAll('.table-wrap[data-rkey]').forEach(wrap => {
        const key = wrap.getAttribute('data-rkey');
        const table = wrap.querySelector('table');
        if (!table) return;
        const headerRow = table.querySelector('tr');
        if (!headerRow) return;
        const ths = Array.from(headerRow.children).filter(el => el.tagName === 'TH');
        const saved = window.__colWidths[key];
        ths.forEach((th, i) => {
          if (saved && saved[i]) th.style.width = saved[i] + 'px';
          if (!th.querySelector('.resizer')) {
            const r = document.createElement('div');
            r.className = 'resizer';
            r.addEventListener('mousedown', e => startColumnResize(e, th, key, i));
            th.appendChild(r);
          }
        });
      });
    }
    function startColumnResize(e, th, key, index) {
      e.preventDefault();
      e.stopPropagation();
      const startX = e.pageX;
      const startWidth = th.getBoundingClientRect().width;
      const handle = e.target;
      handle.classList.add('resizing');
      function onMove(ev) {
        const w = Math.max(50, Math.round(startWidth + (ev.pageX - startX)));
        th.style.width = w + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('resizing');
        window.__colWidths[key] = window.__colWidths[key] || {};
        window.__colWidths[key][index] = th.getBoundingClientRect().width;
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    /* Renders (or re-renders) the actual Google Sign-In button into #google-signin-btn.
       Google's library owns that DOM node directly, so this has to run after renderLogin()'s
       HTML has been inserted into the page — see the state.currentUser branch in render(). */
    function renderGoogleButton() {
      if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com') return;
      const target = document.getElementById('google-signin-btn');
      if (!target || !window.google || !google.accounts || !google.accounts.id) return;
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
      google.accounts.id.renderButton(target, { theme: 'outline', size: 'large', width: 320, text: 'signin_with' });

    /* Decodes a JWT's payload without verifying its signature. Fine here because there's no
       backend to verify against — Google's own library only invokes this callback after it has
       already validated the token, and the payload is only used to read the signed-in person's
       own email/name/picture, never trusted for anything security-critical beyond that. */
    function decodeJwtPayload(token) {
      try {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(json);
      } catch (e) { return null; }
    }
    function handleGoogleCredential(response) {
      const payload = decodeJwtPayload(response.credential);
      if (!payload || !payload.email) { state.loginError = 'Could not read your Google account. Please try again.'; render(); return; }
      if (payload.email_verified === false) { state.loginError = 'Your Google email is not verified.'; render(); return; }
      const email = payload.email.toLowerCase();

      if (state.users.length === 0) {
        // Bootstrap: nobody has ever signed in on this tracker yet, so the first Google
        // account to do so becomes the admin/owner. Everyone after this becomes a user.
        const admin = { username: email, email, name: payload.name || email, picture: payload.picture || '', role: 'admin' };
        state.users.push(admin);
        storageSet(K_USERS, state.users);
        finishLogin(admin);
        return;
      }

      let match = state.users.find(u => (u.email || u.username).toLowerCase() === email);
      if (!match) {
        match = { username: email, email, name: payload.name || email, picture: payload.picture || '', role: 'user' };
        state.users.push(match);
      }
      if (!state.users.some(u => u.role === 'admin')) match.role = 'admin';
      // Keep name/photo fresh from the Google account on every sign-in.
      match.name = payload.name || match.name;
      match.picture = payload.picture || match.picture;
      storageSet(K_USERS, state.users);

    function doLogout() {

    function switchTab(id) { state.activeTab = id; render(); }

    /* ================= DASHBOARD ================= */
    function renderDashboard() {
      const u = state.currentUser;
      const isCeo = u.role === 'admin';
      const viewAsUsername = isCeo ? state.viewingAsRep : null;
      const viewAsRepMode = !!viewAsUsername;
      const orders = viewAsRepMode ? state.orders.filter(o => o.salesPerson === viewAsUsername) : myOrders();
      let attention = needsAttention(orders);
      attention = applyDashFilters(attention);
      const showCeoColumns = isCeo && !viewAsRepMode;

      const won = orders.filter(o => o.dealStage.startsWith('6.'));
      const lost = orders.filter(o => o.dealStage.startsWith('7.'));
      const open = orders.filter(o => !o.dealStage.startsWith('6.') && !o.dealStage.startsWith('7.'));
      const pipelineValue = open.reduce((s, o) => s + Number(o.estimatedValue || 0), 0);

      let html = '';

      if (viewAsRepMode) {
        html += `<div class="card" style="margin-bottom:16px;background:var(--accent-bg);border-color:var(--accent);">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div><b>Viewing ${esc(repName(viewAsUsername))}'s page</b><span style="color:var(--muted);font-size:12px;"> — signed in as Admin, read-only view</span></div>
        <button class="btn" onclick="backToTeamOverview()">\u2190 Back to team overview</button>
      </div>
    </div>`;
      }

      if (!showCeoColumns) {
        html += `<div class="stat-grid">
      <div class="stat-card"><div class="label">Open pipeline value( INR CR)</div><div class="value">${fmtCr(pipelineValue)}</div><div class="sub">${open.length} active deals</div></div>
      <div class="stat-card"><div class="label">No of Closed won</div><div class="value">${won.length}</div><div class="sub">${fmtCr(won.reduce((s, o) => s + Number(o.estimatedValue || 0), 0))}</div></div>
      <div class="stat-card"><div class="label">No of Closed lost</div><div class="value">${lost.length}</div><div class="sub">${fmtCr(lost.reduce((s, o) => s + Number(o.estimatedValue || 0), 0))}</div></div>
      <div class="stat-card"><div class="label">No of Orders logged</div><div class="value">${orders.length}</div></div>
    </div>`;
      } else {
        const repList = reps();
        html += `<div class="stat-grid">
      <div class="stat-card"><div class="label">Total sales reps</div><div class="value">${repList.length}</div></div>
      <div class="stat-card"><div class="label">Active in field</div><div class="value">${repList.filter(r => isRepActive(r.username)).length}</div><div class="sub">Seen in the last ${ACTIVE_WINDOW_MIN} min</div></div>

    </div>`;
        html += renderTeamOverview(repList);

      html += `<div class="filter-bar" style="margin-top:4px;">

    async function downloadDailyReport() {
      if (typeof XLSX === 'undefined') { alert('Excel export library did not load — check your internet connection and try again.'); return; }
      const mode = state.reportRangeMode;
      let fromDate, toDate;
      const today = new Date();
      if (mode === 'daily') { fromDate = todayStr(); toDate = todayStr(); }
      else if (mode === 'weekly') { const d = new Date(today); d.setDate(d.getDate() - 6); fromDate = d.toISOString().slice(0, 10); toDate = todayStr(); }
      else if (mode === 'monthly') { const d = new Date(today); d.setDate(d.getDate() - 29); fromDate = d.toISOString().slice(0, 10); toDate = todayStr(); }
      else {
        fromDate = grab('report-range-from'); toDate = grab('report-range-to');
        if (!fromDate || !toDate) { alert('Pick both a from and to date.'); return; }
      }
      state.reportRangeFrom = fromDate; state.reportRangeTo = toDate;

      const scoped = myOrders();
      const inWindow = scoped.filter(o => (o.dateLogged || '') >= fromDate && (o.dateLogged || '') <= toDate);
      if (!inWindow.length) { alert('No deals logged in that range.'); return; }
      const rows = buildMasterDataRows(inWindow);
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.min(32, Math.max(12, k.length + 2)) }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Deals Master Data');
      XLSX.writeFile(wb, `Deal_Report_${fromDate}_to_${toDate}.xlsx`);
    }
    function openDealCycle(id) {

    }
    function setDealCycleActionFilter(v) { state.dealCycleActionFilter = v; render(); }
    function setDealCycleDelayTypeFilter(v) { state.dealCycleDelayTypeFilter = v; render(); }
    function buildDealCycleSheets(o) {
      const overview = [{
        'Client': o.clientName || '', 'Project': o.projectName || '', 'Sales Rep': repName(o.salesPerson),
        'Product': o.product || '', 'Project Type': o.projectType || '', 'Location': o.location || '',
        'Estimated Value (Cr)': o.estimatedValue || 0, 'Priority': o.priority || '',
        'Current Stage': o.dealStage || '', 'Date Logged': o.dateLogged || '', 'Closed Date': o.closedDate || '',
        'Total Deal Cycle Time (days)': totalCycleDays(o), 'Reason for Win/Loss': o.reasonLostWon || ''
      }];
      const stages = (o.stageHistory || []).map(s => {
        const terminal = s.stage.startsWith('6.') || s.stage.startsWith('7.');
        const end = s.endDate || (terminal ? null : todayStr());
        return {
          'Deal Stage': s.stage, 'Start Date': s.startDate || '', 'End Date': terminal ? '' : (s.endDate || 'Ongoing'),
          'Total Time (days)': end ? daysBetween(s.startDate, end) : ''
        };
      });
      const actions = (o.actionHistory || []).map(a => {
        const plannedEnd = a.plannedEnd || plannedEndForAction(o, a);
        const plannedStart = a.plannedStart || a.setDate;
        const ptd = plannedEnd ? daysBetween(plannedStart, plannedEnd) : null;
        const actualEnd = a.endDate || todayStr();
        const atd = daysBetween(a.setDate, actualEnd);
        const status = a.endDate ? (actionStatus(ptd, atd) || '') : 'Ongoing';
        const totalDelay = (status === 'Delay') ? Math.max(0, atd - ptd) : 0;
        return {
          'Next Follow up Action': a.text || '', 'Planned Start Date': plannedStart || '', 'Planned End Date': plannedEnd || '',
          'Planned Total Days (PTD)': ptd === null ? '' : ptd, 'Type of Action': a.actionType || '',

      const isClosingNow = newStage.startsWith('6.') || newStage.startsWith('7.');

      const newActionType = grab('f-actionType');
      let newActionStartDate = grab('f-actionStartDate');
      let newActionEndDate = grab('f-actionEndDate');
      if (newNextAction && !newActionType) { alert('Please classify this Next Follow up Action as Internal or External before saving.'); return; }
      if (newNextAction && !newActionStartDate) newActionStartDate = todayStr(); // default rather than block the save

      const actionChanged = (d.nextAction || '') !== (newNextAction || '');
      let actionDelayReason = state.modal.tempDelayReason || '';
      let actionDelayType = state.modal.tempDelayType || '';
      let actionRemarks = '';
      if (d.id && actionChanged) {
        actionRemarks = state.modal.tempRemarks || (document.getElementById('f-actionRemarks') ? grab('f-actionRemarks').trim() : '');
      }

      const productSel = grab('f-productSelect');
      const product = productSel === 'Others' ? grab('f-productOther').trim() : productSel;
      const clientMobile = grab('f-clientMobile').replace(/\D/g, '');

      const required = {
        'Client name / company': grab('f-clientName'),
        'Client POC': grab('f-clientPOC'),
        'POC designation': grab('f-clientPOCDesignation'),
        'Product of interest': product,
        'Project name & description': grab('f-projectName'),
        'Location / region': grab('f-location'),
        'Next Follow up Action': newNextAction
      };
      for (const [label, val] of Object.entries(required)) {
        if (!val) { alert(label + ' is required.'); return; }
      }
      if (!(parseFloat(grab('f-estimatedValue')) > 0)) { alert('Estimated value (Cr) is required and must be greater than 0.'); return; }
      if (clientMobile.length !== 10) { alert('POC mobile must be exactly 10 digits.'); return; }
      const emailVal = grab('f-clientEmail').trim();
      if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) { alert('A valid POC email is required.'); return; }
      if (!newFollowUpDate && !isClosingNow) { alert('New follow-up date is required (unless the deal is being closed Won or Lost).'); return; }

      const tracking = computeTrackingUpdates(d, newStage, newNextAction, newFollowUpDate, newActionType, actionDelayReason, actionDelayType, '', actionRemarks, newActionStartDate, newActionEndDate);
      const updated = {
        id: d.id || uid(),
        dateLogged: grab('f-dateLogged'),
        salesPerson: document.getElementById('f-salesPerson') ? grab('f-salesPerson') : d.salesPerson,
        leadSourceType: grab('f-leadSourceType'),
        leadSourceName: grab('f-leadSourceName'),
        clientName: grab('f-clientName'),
        clientPOC: grab('f-clientPOC'),
        clientPOCDesignation: grab('f-clientPOCDesignation'),
        clientMobile: clientMobile,
        clientEmail: emailVal,
        product: product,
        projectName: grab('f-projectName'),
        projectType: grab('f-projectType'),
        location: grab('f-location'),
        estimatedValue: parseFloat(grab('f-estimatedValue')) || 0,
        priority: grab('f-priority'),
        dealStage: newStage,
        stageChangedDate: tracking.stageChangedDate,
        stageHistory: tracking.stageHistory,
        nextAction: newNextAction,
        actionStartDate: newNextAction ? newActionStartDate : '',
        actionEndDate: newNextAction ? newActionEndDate : '',
        nextActionChangedDate: tracking.nextActionChangedDate,
        actionHistory: tracking.actionHistory,
        followUpDate: newFollowUpDate,
        followUpHistory: tracking.followUpHistory,
        reasonLostWon: grab('f-reasonLostWon'),
        closedDate: closedDate,
        updates: d.updates || []
      };
      const idx = state.orders.findIndex(o => o.id === updated.id);
      if (idx >= 0) state.orders[idx] = updated; else state.orders.push(updated);
      await storageSet(K_ORDERS, state.orders);

      const nowLost = updated.dealStage.startsWith('7.');
      if (nowLost && !wasLost) {
        const exists = state.lostOrders.find(l => l.clientName === updated.clientName && l.linkedOrderId === updated.id);
        if (!exists) {
          state.lostOrders.push({
            id: uid(), linkedOrderId: updated.id, dateAnalysed: todayStr(),
            clientName: updated.clientName, projectName: updated.projectName,
            estimatedValue: updated.estimatedValue, competitorWhoWon: '', rootCause: updated.reasonLostWon || '',
            improvementsRequired: '', actionOwner: '', targetDate: '', status: 'Not started', notes: []
          });
          await storageSet(K_LOST, state.lostOrders);
        }
      }
      closeModal();
    }

    }

      l[field] = value;
      if (field === 'status' && value === 'Implemented' && !l.completedDate) l.completedDate = todayStr();
      if (field === 'status' && value !== 'Implemented') l.completedDate = '';
      await storageSet(K_LOST, state.lostOrders);
      render();
    }

      const l = state.lostOrders.find(x => x.id === id);

    function filteredOrdersFor(username) {
      const orders = state.orders.filter(o => o.salesPerson === username);
      const range = state.statsRange;
      return range === 'all' ? orders : orders.filter(o => inRange(o.dateLogged, range, state.statsDate));
    }
    /* Aggregates the bottleneck-tracking data (follow-up on-time/delayed, action delay type,
       average days per stage, average total deal cycle time) across a set of orders. Kept separate
       from statsFor() so CEO-wide totals can be computed once over every rep's orders instead of
       averaging each rep's average (which would be wrong). */
    function computeMasterStats(orders) {
      let followUpOnTime = 0, followUpDelayed = 0, delayInternal = 0, delayExternal = 0, delayBoth = 0;
      const stageDaySums = STAGES.map(_ => ({ sum: 0, count: 0 }));
      let cycleDaySum = 0, cycleDayCount = 0;
      orders.forEach(o => {
        (o.followUpHistory || []).forEach(f => {
          const d = daysBetween(f.targetDate, f.doneDate);
          if (d > 0) followUpDelayed++; else followUpOnTime++;
        });
        (o.actionHistory || []).forEach(a => {
          if (a.delayType === 'Internal') delayInternal++;
          else if (a.delayType === 'External') delayExternal++;
          else if (a.delayType === 'Both') delayBoth++;
        });
        (o.stageHistory || []).forEach(s => {
          const idx = STAGES.indexOf(s.stage);
          if (idx < 0) return;
          if (s.stage.startsWith('6.') || s.stage.startsWith('7.')) return; // terminal stages are end markers, not durations
          const end = s.endDate || todayStr();
          const days = daysBetween(s.startDate, end);
          stageDaySums[idx].sum += days; stageDaySums[idx].count++;
        });
        if (o.dealStage.startsWith('6.') || o.dealStage.startsWith('7.')) {
          cycleDaySum += totalCycleDays(o); cycleDayCount++;
        }
      });
      return {
        followUpOnTime, followUpDelayed, delayInternal, delayExternal, delayBoth,
        avgStageDays: stageDaySums.slice(0, OPEN_STAGES.length).map(x => x.count ? Math.round(x.sum / x.count) : 0),
        avgCycleDays: cycleDayCount ? Math.round(cycleDaySum / cycleDayCount) : 0
      };
    }

    function statsFor(username) {
      const filtered = filteredOrdersFor(username);
      const won = filtered.filter(o => o.dealStage.startsWith('6.'));
      const lost = filtered.filter(o => o.dealStage.startsWith('7.'));
      const open = filtered.filter(o => !o.dealStage.startsWith('6.') && !o.dealStage.startsWith('7.'));
      const winRate = (won.length + lost.length) > 0 ? Math.round(won.length / (won.length + lost.length) * 100) : 0;
      return {
        logged: filtered.length,
        pipelineValue: open.reduce((s, o) => s + Number(o.estimatedValue || 0), 0),
        wonCount: won.length, wonValue: won.reduce((s, o) => s + Number(o.estimatedValue || 0), 0),
        lostCount: lost.length, lostValue: lost.reduce((s, o) => s + Number(o.estimatedValue || 0), 0),
        winRate,
        hot: filtered.filter(o => o.priority === 'Hot').length,
        warm: filtered.filter(o => o.priority === 'Warm').length,
        cold: filtered.filter(o => o.priority === 'Cold').length,
        stageCounts: STAGES.map(s => filtered.filter(o => o.dealStage === s).length),
        ...computeMasterStats(filtered)
      };
    }

    ${teamRows.length ? `<div class="table-wrap" data-rkey="ceo-stats-team"><table>

    let charts = {};
    function drawCharts() {
      const isCeo = state.currentUser.role === 'admin';
      let s;

      const ordersToChart = isCeo ? reps().flatMap(r => filteredOrdersFor(r.username)) : filteredOrdersFor(state.currentUser.username);
      const openForChart = ordersToChart.filter(o => !o.dealStage.startsWith('6.') && !o.dealStage.startsWith('7.'));
      const productValues = {};
      openForChart.forEach(o => {
        const p = o.product || 'Others';
        productValues[p] = (productValues[p] || 0) + Number(o.estimatedValue || 0);
      });
      const pLabels = Object.keys(productValues);
      const pData = Object.values(productValues);

      if (isCeo) {
        const priorityAgg = reps().reduce((acc, r) => {
          const st = statsFor(r.username);
          acc.hot += st.hot; acc.warm += st.warm; acc.cold += st.cold;
          acc.stageCounts = acc.stageCounts.map((v, i) => v + st.stageCounts[i]);
          return acc;
        }, { hot: 0, warm: 0, cold: 0, stageCounts: STAGES.map(_ => 0) });
        s = { ...priorityAgg, ...computeMasterStats(reps().flatMap(r => filteredOrdersFor(r.username))) };
      } else {
        s = statsFor(state.currentUser.username);
      }

      const pEl = document.getElementById('chart-priority');
      const stEl = document.getElementById('chart-stage');
      const prodEl = document.getElementById('chart-product');
      const dEl = document.getElementById('chart-delaytype');
      const sdEl = document.getElementById('chart-stagedays');
      const wlEl = document.getElementById('chart-winloss');
      const rsEl = document.getElementById('chart-revstage');

      if (!pEl || !stEl || typeof Chart === 'undefined') return;
      ['priority', 'stage', 'product', 'delaytype', 'stagedays', 'winloss', 'revstage'].forEach(k => { if (charts[k]) charts[k].destroy(); });

      charts.priority = new Chart(pEl.getContext('2d'), {
        type: 'doughnut',
        data: { labels: ['Hot', 'Warm', 'Cold'], datasets: [{ data: [s.hot, s.warm, s.cold], backgroundColor: ['#b23b3b', '#c9821f', '#7a201e'] }] },
        options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11, family: 'Inter' } } } } }
      });
      charts.stage = new Chart(stEl.getContext('2d'), {
        type: 'bar',
        data: { labels: STAGES.map(x => x.replace(/^\d+\.\s*/, '').slice(0, 14)), datasets: [{ data: s.stageCounts, backgroundColor: '#7a201e' }] },
        options: { maintainAspectRatio: false, responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { stepSize: 1 } } } }
      });
      if (prodEl) {
        charts.product = new Chart(prodEl.getContext('2d'), {
          type: 'doughnut',
          data: { labels: pLabels, datasets: [{ data: pData, backgroundColor: ['#7a201e', '#c9821f', '#a1650f', '#b23b3b', '#d9a34a', '#5c1614', '#8f8880'] }] },
          options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11, family: 'Inter' } } } } }
        });
      }
      if (dEl) {
        charts.delaytype = new Chart(dEl.getContext('2d'), {
          type: 'doughnut',
          data: { labels: ['Internal', 'External', 'Both'], datasets: [{ data: [s.delayInternal, s.delayExternal, s.delayBoth], backgroundColor: ['#c9821f', '#b23b3b', '#7a201e'] }] },
          options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11, family: 'Inter' } } } } }
        });
      }
      if (sdEl) {

          type: 'bar',
          data: { labels: OPEN_STAGES.map(x => x.replace(/^\d+\.\s*/, '').slice(0, 16)), datasets: [{ label: 'Avg days', data: s.avgStageDays, backgroundColor: '#a1650f' }] },
          options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { stepSize: 1 } } } }
        });

      if (wlEl) {

          type: 'pie',
          data: { labels: ['Won', 'Lost'], datasets: [{ data: [s.wonCount, s.lostCount], backgroundColor: ['#0f9d4f', '#b23b3b'] }] },
          options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11, family: 'Inter' } } } } }
        });
      }
      if (rsEl) {
        const revByStage = STAGES.map(stage => {
          return ordersToChart.filter(o => o.dealStage === stage).reduce((sum, o) => sum + Number(o.estimatedValue || 0), 0);
        });
        charts.revstage = new Chart(rsEl.getContext('2d'), {
          type: 'bar',

          options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

    /* ================= TEAM (CEO only) ================= */

    async function addRep() {
      const name = grab('t-name'), email = grab('t-email').trim().toLowerCase();
      if (!name || !email) { alert('Fill in all fields.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Enter a valid email address.'); return; }
      if (state.users.some(u => (u.email || u.username).toLowerCase() === email)) { alert('That email is already in the user list.'); return; }
      state.users.push({ username: email, email, role: 'user', name, picture: '' });
      await storageSet(K_USERS, state.users);
      render();
    }
    async function removeRep(username) {
      if (!confirm('Remove this sales rep? Their historical orders will remain in the pipeline.')) return;
      state.users = state.users.filter(u => u.username !== username);
      await storageSet(K_USERS, state.users);
      render();
    }

    /* Migrates user and ownership records left over from older local versions. */
    function migrateLegacyRoles() {
      let changed = false;
      state.users = state.users.filter(u => {
        const username = (u.username || '').toLowerCase();
        const email = (u.email || '').toLowerCase();
        const hasGoogleEmail = username.includes('@') || email.includes('@');
        if (!hasGoogleEmail) { changed = true; return false; }
        if (u.role === 'ceo') { u.role = 'admin'; changed = true; }
        if (u.role === 'rep') { u.role = 'user'; changed = true; }
        // Accounts created before Google Sign-In was added had a password instead of an email.
        // Drop the leftover password and fall back to the username so the record doesn't crash
        // on u.email. The account can be edited afterward.
        if (u.password !== undefined) { delete u.password; changed = true; }
        if (u.email === undefined) { u.email = u.username; changed = true; }
        return true;
      });
      return changed;
    }

    /* ================= INIT ================= */
    async function init() {
      const [u, o, c, l, a, v] = await Promise.all([storageGet(K_USERS), storageGet(K_ORDERS), storageGet(K_COORD), storageGet(K_LOST), storageGet(K_ACTIVITY), storageGet(K_DATA_VERSION)]);
      state.users = u || [];
      state.orders = o || [];
      state.coordination = c || [];
      state.lostOrders = l || [];
      state.activity = a || {};
      const migrated = migrateLegacyRoles();
      const storedVersion = v && v.v ? v.v : null;
      if (storedVersion !== EMPTY_DATA_VERSION) {
        if (storedVersion || state.orders.length || state.coordination.length || state.lostOrders.length) {
          await clearPipelineData();
        } else {
          await storageSet(K_DATA_VERSION, { v: EMPTY_DATA_VERSION });
        }
      }
      if (migrated) {
        await storageSet(K_USERS, state.users);
      }
      state.loaded = true;
      render();
    }
    init();
  </script>
</body>
